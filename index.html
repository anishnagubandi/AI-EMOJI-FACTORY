    <title>AI Emoji Factory</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'brand-purple': '#6d28d9',
              'brand-pink': '#db2777',
              'brand-gray': '#1f2937',
            },
            animation: {
              'fade-in': 'fadeIn 0.5s ease-in-out',
              'pop-in': 'popIn 0.5s cubic-bezier(0.68, -0.55, 0.27, 1.55)',

            keyframes: {

              }
            }
          }
        }
      }
